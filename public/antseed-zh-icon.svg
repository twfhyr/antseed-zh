<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>antseed-zh</title>
  <!--
    Icon for antseed-zh.

    Built from the official AntSeed mark (apps/website/static/antseed-logo-icon.svg
    in the monorepo): the same three-segment ant body, six legs and two antennae,
    in the official emerald #10B981 on the site's dark background. The Chinese
    element is the character 蚁 ("ant") set in the lower-right corner as a
    community badge, which is what distinguishes this from the upstream mark.
    Geometry is scaled from the original 200x200 viewBox to 256x256 (x1.28)
    and shifted up/left slightly to leave room for the badge.
  -->
  <defs>
    <clipPath id="round">
      <rect width="256" height="256" rx="56" />
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="256" height="256" fill="#0B1512" />

    <g transform="translate(-4 -10) scale(1.2)" fill="#10B981">
      <!-- antenna tips -->
      <circle cx="69.57" cy="27.49" r="6.25" />
      <circle cx="129.57" cy="27.49" r="6.25" />
      <!-- leg tips, front pair -->
      <circle cx="44.57" cy="67.49" r="6.25" />
      <circle cx="154.57" cy="67.49" r="6.25" />
      <!-- leg tips, middle pair -->
      <circle cx="34.57" cy="112.49" r="6.25" />
      <circle cx="164.57" cy="112.49" r="6.25" />
      <!-- leg tips, rear pair -->
      <circle cx="39.57" cy="162.49" r="6.25" />
      <circle cx="159.57" cy="162.49" r="6.25" />

      <!-- head / thorax / abdomen -->
      <ellipse cx="99.57" cy="67.49" rx="12.5" ry="13.75" />
      <ellipse cx="99.57" cy="102.49" rx="17.5" ry="20" />
      <ellipse cx="99.57" cy="149.99" rx="22.5" ry="30" />

      <!-- antennae -->
      <path d="M68.574 25.751a2.25 2.25 0 0 1 3.167.315l22.5 27.5a2.25 2.25 0 1 1-3.482 2.851l-22.5-27.5a2.25 2.25 0 0 1 .315-3.166Z" />
      <path d="M128.259 26.066a2.25 2.25 0 0 1 3.482 2.851l-22.5 27.5a2.25 2.25 0 0 1-3.482-2.851l22.5-27.5Z" />

      <!-- front legs -->
      <path d="M43.013 66.44a2.25 2.25 0 0 1 3.039-.935l42.5 22.5a2.25 2.25 0 1 1-2.104 3.975l-42.5-22.5a2.25 2.25 0 0 1-.935-3.04Z" />
      <path d="M153.948 65.505a2.25 2.25 0 0 1 2.104 3.974l-42.5 22.5a2.25 2.25 0 1 1-2.104-3.975l42.5-22.5Z" />

      <!-- middle legs -->
      <path d="M82.266 105.253a2.25 2.25 0 0 1 .468 4.478l-47.5 5a2.25 2.25 0 1 1-.468-4.478l47.5-5Z" />
      <path d="M117.734 105.253l47.5 5a2.25 2.25 0 0 1-.468 4.478l-47.5-5a2.25 2.25 0 0 1 .468-4.478Z" />

      <!-- rear legs -->
      <path d="M84.087 140.436a2.25 2.25 0 0 1 1.826 4.111l-45 20a2.25 2.25 0 0 1-1.826-4.111l45-20Z" />
      <path d="M112.944 141.579a2.25 2.25 0 0 1 2.969-1.143l45 20a2.25 2.25 0 0 1-1.826 4.111l-45-20a2.25 2.25 0 0 1-1.143-2.968Z" />
    </g>

    <!-- Chinese badge: 蚁 = "ant" -->
    <g>
      <circle cx="196" cy="196" r="46" fill="#0B1512" />
      <circle cx="196" cy="196" r="40" fill="#10B981" />
