<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <!-- %BASE_URL% so the icon resolves under both deploy targets: the
         root domain (base "/") and the legacy /zh/ path (base "/zh/"). -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%antseed-zh-icon.svg" />
    <link rel="alternate icon" type="image/png" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#0B1512" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>antseed-zh — Community Dashboard for the AntSeed Network</title>
    <meta name="description" content="Live buyer/seller stats, service catalog, and $ANTS tokenomics for the AntSeed peer-to-peer AI inference network — a community-built dashboard, not an official AntSeed product." />

    <!-- Social share preview (link unfurls in Slack/Twitter/iMessage/etc).
         English on purpose — the app UI defaults to zh, but these tags are
         read by crawlers/bots, not rendered by the zh/en toggle, so they
         need their own fixed language. Kept in this static index.html
         (not injected by React) since most crawlers don't execute JS.
         Modeled on antseed.com's own og/twitter tags. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="antseed-zh" />
    <meta property="og:url" content="https://antseed-zh.com/" />
    <meta property="og:title" content="antseed-zh — Community Dashboard for the AntSeed Network" />
    <meta property="og:description" content="Live buyer/seller stats, service catalog, and $ANTS tokenomics for the AntSeed peer-to-peer AI inference network — a community-built dashboard, not an official AntSeed product." />
    <meta property="og:image" content="https://antseed-zh.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="antseed-zh — community dashboard for the AntSeed network" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="antseed-zh — Community Dashboard for the AntSeed Network" />
    <meta name="twitter:description" content="Live buyer/seller stats, service catalog, and $ANTS tokenomics for the AntSeed peer-to-peer AI inference network." />
    <meta name="twitter:image" content="https://antseed-zh.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
